
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'instacart_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'instacart_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  instacart_dbt:

    # Staging layer — thin wrappers over raw source tables.
    # Each model selects and renames columns, applies light casts,
    # and nothing else. No joins, no business logic here.
    staging:
      +materialized: view
      +schema: staging

    # Intermediate layer — where joins and derived columns live.
    # Models here combine staging tables into analysis-ready sets.
    # Built as views so marts always pull fresh data.
    intermediate:
      +materialized: view
      +schema: intermediate

    # Marts layer — the outputs that feed dashboards and reports.
    # Built as tables so queries against them are fast.
    # These are what stakeholders and BI tools point at.
    marts:
      +materialized: table
      +schema: marts
